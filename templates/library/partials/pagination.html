{% if rows.paginator.num_pages > 1 %}<div class="pagination"><span>Саҳифаи {{ rows.number }} аз {{ rows.paginator.num_pages }} · {{ rows.paginator.count }} сабт</span><div>{% if rows.has_previous %}<a class="button ghost small" href="?q={{ q|urlencode }}&grade={{ grade }}&group={{ group|urlencode }}&status={{ status }}&page={{ rows.previous_page_number }}">← Пешина</a>{% endif %}{% if rows.has_next %}<a class="button ghost small" href="?q={{ q|urlencode }}&grade={{ grade }}&group={{ group|urlencode }}&status={{ status }}&page={{ rows.next_page_number }}">Баъдӣ →</a>{% endif %}</div></div>{% endif %}
